name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./engine
      - run: go test ./engine

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            args: -nsis
          - os: macos-latest
            platform: darwin/universal
            args: ""
          - os: ubuntu-24.04
            platform: linux/amd64
            args: -tags webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} ${{ matrix.args }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/x509-inspector
          cp build/bin/x509-inspector dist/x509-inspector/
          cp packaging/linux/x509-inspector.desktop dist/x509-inspector/
          cp packaging/linux/install.sh dist/x509-inspector/
          tar -C dist -czf x509-inspector-linux-amd64.tar.gz x509-inspector
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd build/bin && ditto -c -k --keepParent "x509-inspector.app" ../../x509-inspector-macos-universal.zip
      - name: Package (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path build/bin/x509-inspector.exe -DestinationPath x509-inspector-windows-amd64-portable.zip
          Get-ChildItem build/bin -Recurse | Select-Object FullName
          $inst = Get-ChildItem build/bin -Recurse -Filter *installer*.exe | Select-Object -First 1
          if (-not $inst) { throw "Installer NSIS tidak ditemukan di build/bin" }
          Copy-Item $inst.FullName x509-inspector-windows-amd64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: x509-inspector-${{ runner.os }}
          path: |
            x509-inspector-*.zip
            x509-inspector-*.tar.gz
            x509-inspector-*-setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            x509-inspector-*.zip
            x509-inspector-*.tar.gz
            x509-inspector-*-setup.exe
